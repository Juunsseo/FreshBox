[project]
name = "freshbox-backend"
version = "0.1.0"
description = "FreshBox BLE ingestion, persistence, freshness estimates, and frontend API"
requires-python = ">=3.11"
dependencies = [
  "bleak>=3.0,<4",
  "fastapi>=0.115,<1",
  "openai>=1.100,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
